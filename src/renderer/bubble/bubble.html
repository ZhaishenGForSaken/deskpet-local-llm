<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeskLLMPet Bubble</title>
  <link rel="stylesheet" href="bubble.css">
</head>
<body>
  <div id="bubble-root" class="hidden">
    <!-- 余额卡片 -->
    <div id="bubble-card" class="balance-card hidden">
      <div class="balance-head">
        <span class="balance-icon">🐋</span>
        <span class="balance-title" id="balance-title">API 余额</span>
        <span class="balance-badge" id="balance-badge">DeepSeek</span>
      </div>
      <div class="balance-value" id="balance-value"></div>
      <div class="balance-sub" id="balance-sub"></div>
    </div>
    <!-- 普通文字气泡 -->
    <div id="bubble-text" class="text-bubble"></div>
    <div class="bubble-tail"></div>
  </div>
  <script src="bubble.js"></script>
</body>
</html>
